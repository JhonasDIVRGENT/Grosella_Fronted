<div class="login-fondo">
  <div class="login-card">
    <header>
      <h1>Pastelería Grosella</h1>
      <p>Gestión de Pedidos · Iniciar sesión</p>
    </header>
    <form (ngSubmit)="ingresar()">
      @if (error()) {
        <div class="alerta alerta-error">{{ error() }}</div>
      }
      <div class="campo grupo">
        <label for="usuario">Usuario</label>
        <input id="usuario" name="usuario" [(ngModel)]="usuario" autocomplete="username" autofocus />
      </div>
      <div class="campo grupo">
        <label for="contrasena">Contraseña</label>
        <input id="contrasena" name="contrasena" type="password" [(ngModel)]="contrasena" autocomplete="current-password" />
      </div>
      <button class="btn btn-primario" type="submit" [disabled]="cargando()">
        {{ cargando() ? 'Ingresando…' : 'Ingresar' }}
      </button>
      <p class="ayuda">
        Versión V01 (simulación). Usuarios de prueba: <b>admin</b>, <b>atencion</b>, <b>encargado</b>,
        <b>preparacion</b> · contraseña <b>123456</b>
      </p>
    </form>
  </div>
</div>
